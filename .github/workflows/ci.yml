name: AMDataWrap V4.5 CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Run pytest
        run: pytest -q

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-v4.1
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend-v4.1/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: TypeScript typecheck
        run: npx tsc --noEmit
      - name: Run Vitest unit tests
        run: npm test
      - name: Production Vite build
        run: npm run build
      - name: Bundle size summary
        run: |
          echo "### Frontend Bundle Sizes" >> "$GITHUB_STEP_SUMMARY"
          ls -lh dist/assets/*.js dist/assets/*.css | awk '{print "- `" $9 "`: " $5}' >> "$GITHUB_STEP_SUMMARY"
